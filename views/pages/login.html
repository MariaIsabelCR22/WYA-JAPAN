<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYA JAPAN - INICIAR SESIÓN</title>
    <link rel="stylesheet" href="../css/log-in.css">
</head>
<body class="auth-body">

    <div class="auth-container">

        <a href="../../index.html" class="auth-close-btn" aria-label="Volver al inicio">✕</a>

        <a href="../../index.html" class="auth-logo-link">
            <img src="../images/logo_png.png" alt="WYA Japan" class="auth-logo">
        </a>

        <div class="auth-tabs">
            <a href="login.html" class="tab-btn active">INICIAR SESIÓN</a>
            <a href="register.html" class="tab-btn">REGISTRARSE</a>
        </div>

        <form id="form-login" class="auth-form active-form">

            <div class="input-group">
                <label>EMAIL</label>
                <input 
                    type="email" 
                    id="login-email"
                    placeholder="TuEmail@gmail.com" 
                    required
                >
            </div>

            <div class="input-group">
                <label>CONTRASEÑA</label>
                <input 
                    type="password" 
                    id="login-password"
                    placeholder="••••••••" 
                    required
                >
            </div>

            <div class="auth-options">
                <a href="#" class="forgot-pass">¿OLVIDASTE TU CONTRASEÑA?</a>
            </div>

            <button type="submit" class="btn-auth">
                INGRESAR
            </button>

        </form>

    </div>

    <script src="../../controllers/auth.js"></script>

</body>
</html>
