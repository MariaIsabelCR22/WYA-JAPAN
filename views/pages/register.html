<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYA JAPAN - REGISTRARSE</title>
    <link rel="stylesheet" href="../css/log-in.css">
</head>
<body class="auth-body">

    <div class="auth-container">

        <a href="../../index.html" class="auth-close-btn" aria-label="Volver al inicio">✕</a>

        <a href="../../index.html" class="auth-logo-link">
            <img src="../images/logo_png.png" alt="WYA Japan" class="auth-logo">
        </a>

        <div class="auth-tabs">
            <a href="login.html" class="tab-btn">INICIAR SESIÓN</a>
            <a href="register.html" class="tab-btn active">REGISTRARSE</a>
        </div>

        <form id="form-register" class="auth-form active-form">

            <div class="input-group">
                <label>NOMBRE COMPLETO</label>
                <input 
                    type="text" 
                    id="register-name"
                    placeholder="TU NOMBRE" 
                        required
                >
            </div>

            <div class="input-group">
                <label>EMAIL</label>
                <input 
                    type="email" 
                    id="register-email"
                    placeholder="TuEmail@gmail.com" 
                    required
                >
            </div>

            <div class="input-group">
                <label>TELÉFONO</label>
                <input 
                    type="tel" 
                    id="register-phone"
                    placeholder="300 000 0000" 
                    required
                >
            </div>

            <div class="input-group">
                <label>CONTRASEÑA</label>
                <input 
                    type="password" 
                    id="register-password"
                    placeholder="CREA UNA CONTRASEÑA" 
                    required
                >
            </div>

            <div class="auth-options legal-checkbox">
                <label>
                    <input type="checkbox" required>
                    <span>ACEPTO LOS TÉRMINOS Y CONDICIONES</span>
                </label>
            </div>

            <button type="submit" class="btn-auth">
                CREAR CUENTA
            </button>

        </form>


    </div>

    <script src="../../controllers/auth.js"></script>

</body>
</html>
